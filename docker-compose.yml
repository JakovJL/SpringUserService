version: '3.8'

services:

  discovery-service:
    build: ./discoveryservice
    ports:
      - "8761:8761"
    healthcheck:
      test: curl --fail http://localhost:8761/eureka || exit 1
      interval: 10s
      retries: 5
      start_period: 15s

  config-server:
    build: ./configserver
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8888/actuator/health || exit 1
      interval: 10s
      retries: 5
      start_period: 20s

  userservice:
    build: ./userservice
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  notificationservice:
    build: ./notificationservice
    ports:
      - "8082:8082"
    depends_on:
      userservice:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  api-gateway:
    build: ./apigateway
    ports:
      - "8080:8080"
    depends_on:
      userservice:
        condition: service_started
      notificationservice:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
